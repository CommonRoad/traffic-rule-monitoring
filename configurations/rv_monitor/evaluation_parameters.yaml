general:
  seed: 10
  num_iters: 5
  with_tex: false

eval_trace_length:
  - name: running_example_atomic
    spec: [
    ["S1", "G((a) S[0, 4] (b))"],
    [
        "S2",
        "G((a) U[0, 4] (b))",
    ],
    ["S3", "G(((a) S[0, 4] (b)) | ((a) U[0, 4] (b)))"]
]
    num_atomics: 2
    max_y: 1.1
    pred: false
    trace_lengths: [20000, 40000, 60000, 80000, 100000, 120000, 140000, 160000, 180000, 200000]
    xlabel: Trace Length [x10000]
  - name: dissimilar_atomic
    spec: [
    ["S1", "G(P[0, 4] a)"],
    [
        "S2",
        "G(X[0, 4] b)",
    ],
    ["S3", "G(((c) S[0, 4] (d)) | ((e) U[0, 4] (f)))"],
]
    num_atomics: 6
    max_y: 1.1
    pred: false
    trace_lengths: [20000, 40000, 60000, 80000, 100000, 120000, 140000, 160000, 180000, 200000]
    xlabel: Trace Length [x10000]

lazy_eval:
  - name: or
    spec: [["S1", "G(f('rand') | e('rand'))"]]
    num_atomics: 6
    max_y: 2.3
    pred: true
    trace_lengths: [200, 400, 600, 800, 1000]
    pred_cost:
      PredCost1:
        "e": [ 1.0, 1.0, 0.0 ]
        "f": [ 100.0, 0.0, 0.0 ]
      PredCost2:
        "e": [ 100.0, 0.0, 0.0 ]
        "f": [ 1.0, 1.0, 0.0 ]
    xlabel: Trace Length
  - name: and
    spec: [["S1", "G(f('rand') & e('rand'))"]]
    num_atomics: 6
    max_y: 2.3
    pred: true
    trace_lengths: [200, 400, 600, 800, 1000]
    pred_cost:
      PredCost3:
        "e": [ 1.0, 0.0, 0.0 ]
        "f": [ 100.0, 1.0, 0.0 ]
      PredCost4:
        "e": [ 100.0, 1.0, 0.0 ]
        "f": [ 1.0, 0.0, 0.0 ]
    xlabel: Trace Length


# Only used by tools/formula_size_eval.py (not part of the paper)
formula_size_eval:
  - name: formula_size_atomic
    num_atomics: 4
    trace_length: 1000
    max_formula_size: 50
    max_y: 0.0125
    pred: false
  - name: formula_size_predicate
    num_atomics: 4
    trace_length: 1000
    max_formula_size: 50
    max_y: 0.25
    pred: true
