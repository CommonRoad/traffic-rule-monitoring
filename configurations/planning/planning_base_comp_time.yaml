planning:
  dt: 0.1
  replanning_frequency: 1
  time_steps_computation: 60

vehicle:
  # CR vehicle type (see commonroad-vehicle-models): #1: Ford Escort, #2: BMW 320i, 3 = VW Vanagon
  id_type_vehicle: 2

sampling:
  d_min: -4
  d_max: 4
  max_deceleration_ratio: 0.2

debug:
  show_plots: False
  save_plots: False
  draw_traj_set: False
  draw_icons: False
  multiproc: False
  traj_vis_filter: ["INFEASIBLE_KINEMATIC"]
  complete_rule_eval: True  # Evaluate all trajectories to simulate critical scenario
  complete_collision_eval: True  # Evaluate all trajectories to simulate critical scenario
  draw_ref_path: False
  draw_planning_problem: False
  draw_prediction_others: False

monitor:
  with_rule_monitoring: True
  activated_traffic_rules: [ 'R_G1' ]
  trace_reset_option: "filter"
  log_level: "info"
  history_size: 101
