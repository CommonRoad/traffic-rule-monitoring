[project]
name = "evaluation"
version = "1.0.0"
readme = { file = "README.md", content-type = "text/markdown" }
description = "Evaluation scripts for the paper 'Efficient Traffic Rule Monitoring for Rule-Compliant Motion Planning of Automated Vehicles'"
authors = [
    { name = "Sebastian Maierhofer", email = "sebastian.maierhofer@tum.de" },
    { name = "Matthias Althoff" },
]
requires-python = ">=3.10,<3.12"

[tool.poetry]
packages = [{ include = "evaluation", from = "src" }]

# The traffic rule monitor (commonroad-monitor, commonroad-cpp, rv-monitors, which also bring commonroad-io), the
# reactive planner with monitor integration, commonroad-prediction, and the CommonRoad-CARLA interface are
# installed from source at pinned versions in the Docker image (see Dockerfile and README).
[tool.poetry.dependencies]
numpy = "^1.26"
pandas = "^2.2"
matplotlib = "^3.8"
pyyaml = "^6.0"
tabulate = ">=0.9"
func-timeout = "^4.3.5"
opencv-python-headless = "^4.9"

[tool.poetry.group.dev]
optional = true

[tool.poetry.group.dev.dependencies]
pre-commit = "^4.0.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 120
indent-width = 4
format.quote-style = "double"
target-version = "py311"
lint.ignore = ["E203"]
lint.select = ["E4", "E7", "E9", "F", "I"]
